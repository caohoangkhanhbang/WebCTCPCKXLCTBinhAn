@if(isOpen()){
<div class="overlay">
    <form (ngSubmit)="onSubmit()" class="cv-container">
        <p class="tieu-de">{{hanhDong() === 'create' ? 'Thêm mới' : hanhDong() === 'view' ? 'Xem chi tiết' : 'Chỉnh
            sửa'}}</p>
        <div class="input-container">
            <label for="giai_phap" class="lien-he-tieude">Tên giải pháp *</label>
            <input type="text" name="giai_phap" id="giai_phap" formControlName="giai_phap" class="lien-he-input"
                placeholder="vui lòng" />

        </div>
        <div class="input-container">
            <label for="noi_dung" class="lien-he-tieude">Nội dung *</label>
            <textarea formControlName="noi_dung" class="lien-he-input" id="noi_dung"
                placeholder="vui lòng nhập đầy đủ thông tin"></textarea>

        </div>
        <div class="input-container">
            <div class="center">
                <label for="hinh" class="lien-he-tieude">Chọn ảnh</label>
                <input type="file" formControlName="hinh" id="hinh" placeholder="vui lòng nhập đầy đủ thông tin">
                <img src="" alt="">
            </div>
        </div>
        <div class="input-container">
            <div class="center">
                <label for="hien_thi" class="lien-he-tieude">Hiển thị</label>
                <input formControlName="hien_thi" type="checkbox" id="hien_thi"
                    placeholder="vui lòng nhập đầy đủ thông tin">
            </div>
        </div>
        <div class="center">
            @if(hanhDong() !== 'view'){
            <button type="submit" class="button pos">Lưu</button>
            }
            <button (click)="onClose()" type="button" class="button neg">Thoát</button>
        </div>
    </form>
</div>
}
