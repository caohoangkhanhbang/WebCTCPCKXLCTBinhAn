<div class="maha-container">
    <div class="grid">
        <div class="row">
            <div class="l-12 m-12 c-12">
                <div class="menu-top">
                    <div class="hamburger" (click)="toggleMenu()">
                        @if (isOpenMenu()) {
                        &#10005;
                        } @else {
                        &#9776;
                        }
                    </div>
                    <div class="ten-cong-ty" routerLink="/tong-quan">
                        <div class="logo" [style.background-image]="'url(' + cdnUrl + '/' + companyInfo()?.logo + ')'">
                        </div>{{companyInfo()?.ten_cty}}
                    </div>
                    <div class="user-info">
                        <div class="user-name">Xin chào</div>
                        <img class="user-avatar" src="/public/resource/images/UserForm.png" alt=""
                            (click)="toggleMenuProfile()">

                        <div class="profile-setting-container" [class.open]="isOpenMenuProfile()">
                            <div class="profile-setting-item" (click)="logout()">
                                Đăng xuất
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="l-2 m-12 c-12">
                <div class="menu" [class.open-menu]="isOpenMenu()" (click)="toggleMenu()">
                    <div class="menu-item" routerLink="/">
                        <div class="icon"
                            style="mask: url('/public/resource/icons/tongquan.svg') no-repeat center / contain;"></div>
                        Tổng quan
                    </div>
                    <div class="menu-item" routerLink="/gioi-thieu">
                        <div class="icon"
                            style="mask: url('/public/resource/icons/gioithieu.svg') no-repeat center / contain;"></div>
                        Giới thiệu
                    </div>
                    <div class="menu-item" routerLink="/linh-vuc-hoat-dong">
                        <div class="icon"
                            style="mask: url('/public/resource/icons/linhvuc.svg') no-repeat center / contain;"></div>
                        Lĩnh vực hoạt động
                    </div>
                    <div class="menu-item" routerLink="/du-an">
                        <div class="icon"
                            style="mask: url('/public/resource/icons/duan.svg') no-repeat center / contain;"></div>
                        Dự án
                    </div>
                    <div class="menu-item" routerLink="/lien-he">
                        <div class="icon"
                            style="mask: url('/public/resource/icons/lienhe.svg') no-repeat center / contain;"></div>

                        Liên hệ
                    </div>
                    <div class="menu-item" routerLink="/tuyen-dung">
                        <div class="icon"
                            style="mask: url('/public/resource/icons/tuyendung.svg') no-repeat center / contain;">
                        </div>
                        Tuyển dụng
                    </div>
                    <div class="menu-item" routerLink="/ung-tuyen">
                        <div class="icon"
                            style="mask: url('/public/resource/icons/duan.svg') no-repeat center / contain;">
                        </div>
                        Ứng tuyển việc làm
                    </div>
                    <div class="menu-item" routerLink="/slide-home">
                        <div class="icon"
                            style="mask: url('/public/resource/icons/tongquan.svg') no-repeat center / contain;"></div>
                        Slide trang chủ
                    </div>
                    <div class="menu-item" routerLink="/thong-tin-cong-ty">
                        <div class="icon"
                            style="mask: url('/public/resource/icons/congty.svg') no-repeat center / contain;"></div>
                        Thông tin công ty
                    </div>
                    <div class="menu-item" routerLink="/hinh-nen">
                        <div class="icon"
                            style="mask: url('/public/resource/icons/linhvuc.svg') no-repeat center / contain;">
                        </div>
                        Hình nền trang
                    </div>
                </div>
            </div>

            <div class="l-10 m-12 c-12">
                <div class="l-12 m-12 c-12 content-container">
                    <div class="maha-content"><router-outlet></router-outlet></div>
                </div>
            </div>
        </div>
    </div>
    <div class="trangtri"></div>
</div>
