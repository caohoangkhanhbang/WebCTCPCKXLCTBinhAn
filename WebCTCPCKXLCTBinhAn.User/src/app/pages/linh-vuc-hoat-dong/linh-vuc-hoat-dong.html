<div class="top-image"
    [style.background-image]="backgroundPath()?.[0]?.hinh ? 'url(' + CombineUrl(backgroundPath()[0]?.hinh) + ')' : ''">
    <div class="white-box"></div>
    <h1 class="top-image-title">{{'HEADER.CORE_SERVICES' | translate}}</h1>
    <h1 class="top-image-title-modified ">{{thongTinCty()?.ten_cty}}</h1>
</div>
<div class="container">
    @for(item of giaiPhap(); track item?.id){
    <div class="container-services">
        <div class="grid wide">
            <div class="row services-item">
                <div class="l-6 m-6 c-12">
                    <img class="services-item-img" [src]="cdnUrl + '/' + item.hinh" alt="{{item?.giai_phap}}" />
                </div>
                <div class="l-6 m-6 c-12 services-item-content">
                    <h1 class="services-item-title">{{item?.giai_phap}}</h1>
                    <h3 class="services-item-description">{{item?.noi_dung}}</h3>
                    <button routerLink="/du-an"
                        class="services-item-button">{{'CORE_SERVICES.LEARN_MORE'|translate}}</button>
                </div>

            </div>
        </div>
    </div>
    }
</div>
