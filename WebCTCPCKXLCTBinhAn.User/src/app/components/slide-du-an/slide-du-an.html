<!-- Dự án tiêu biểu -->
<div class="duan-tieubieu">
    <div class="grid wide">
        <div class="row">
            <div class=" l-3 m-3 c12">
                <div class="duan-left">
                    <h2 class="title">{{'PROJECTS.KEY_PROJECTS'|translate}}</h2>
                    <p class="content">{{'PROJECTS.DESCRIPTION'|translate}}
                    </p>
                    <a class="button-du-an-tieu-bieu" routerLink="/du-an">{{'PROJECTS.VIEW_ALL'|translate}}</a>
                </div>
            </div>
            <div class=" l-9 m-9 c-12">
                <div class="slide-container">
                    @for(item of data(); track $index){
                    <div class="slide" [class.active]="$index === currentIndex">
                        <img src="{{cdnUrl}}/{{item?.hinh}}" alt="{{ item.ten_du_an}}" class="slide-image">

                        <div class="slide-content-container">
                            <div class="slide-number-da">{{ $index + 1 }} trên {{ data().length }}</div>
                            <div class="slide-content-da">
                                {{ item.ten_du_an }}
                            </div>
                        </div>

                    </div>
                    }

                    <div class="icon-left" (click)="onPrevClick()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-chevron-left-icon lucide-chevron-left">
                            <path d="m15 18-6-6 6-6" />
                        </svg>
                    </div>

                    <div class="icon-right" (click)="onNextClick()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-chevron-right-icon lucide-chevron-right">
                            <path d="m9 18 6-6-6-6" />
                        </svg>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<!-- Hết Dự án tiêu biểu -->
