<div class="language-container">
<img class="icon-language" for="lang-select" [src]="'/resource/images/' + selectedLang() + '.svg'" />
<select class="select-language" id="lang-select" [ngModel]="selectedLang()" (ngModelChange)="changeLanguage($event)">
    @for(lang of languages; track lang.code) {
    <option [value]="lang.code">
        {{ lang.name }}
    </option>
    }
</select>
</div>
